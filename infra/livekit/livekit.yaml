# Self-hosted LiveKit config (design doc §2.7). CRITICAL settings for an
# air-gapped LAN are marked below — getting these wrong means LiveKit
# tries to STUN the public internet and startup/ICE degrades badly.
port: 7880
bind_addresses:
  - '0.0.0.0'

rtc:
  tcp_port: 7881
  # UDP mux range for RTC media. Do NOT also set port_range_start/end —
  # they are mutually exclusive with a fixed udp_port range.
  udp_port: 7882-7892
  # CRITICAL: default is `true`, which STUNs the public internet. Air-gapped
  # LAN must be false, or startup/ICE gathering degrades badly.
  use_external_ip: false
  # Pin to the lab server's LAN NIC. Only takes effect when
  # use_external_ip is false. CHANGE THIS to the real server IP before
  # any non-dev deployment — 127.0.0.1 only works for same-machine testing.
  node_ip: 127.0.0.1

room:
  # Only the Nest server creates rooms (via roomService), never a client.
  auto_create: false

keys:
  # Dev-only — matches apps/server/.env's LIVEKIT_API_SECRET. MUST be
  # regenerated again before any real deployment (this one has been
  # seen in a dev log/transcript, which is reason enough on its own).
  devkey: 128932e4320ab0bb4b970fb14a1f35f1f7f2e77b095445f3832ff2dd6d357464

logging:
  level: info

webhook:
  api_key: devkey
  urls:
    - 'http://localhost:3000/api/livekit/webhook'
